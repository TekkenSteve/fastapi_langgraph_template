[project]
name = "agent-server"
version = "0.1.0"
description = "Production-ready Agent Protocol server template — FastAPI + LangGraph + PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["langgraph", "agents", "llm", "fastapi", "agent-protocol"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "fastapi>=0.110.1",
    # >=0.36.0: --loop accepts import strings (Windows selector loop, #513)
    "uvicorn>=0.36.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.2",
    "sse-starlette>=3.3.4,<4.0.0",
    # LangGraph
    "langgraph>=1.0.3",
    "langgraph-sdk>=0.3.5",
    "langgraph-checkpoint-postgres>=2.0.23",
    # Database
    "sqlalchemy>=2.0.0",
    "greenlet>=3.1.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",
    # Observability (OpenTelemetry)
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "openinference-instrumentation-langchain>=0.1.58",
    # Metrics
    # >=8.0.2: 7.x reads route.path on FastAPI >=0.137's _IncludedRouter (which has
    # no .path), 500ing every request when metrics are on. 8.0.2 handles the new tree.
    "prometheus-fastapi-instrumentator>=8.0.2",
    # Utils
    "structlog>=25.4.0",
    "asgi-correlation-id>=4.3.4",
    # Redis (optional broker backend for multi-instance streaming)
    "redis[hiredis]>=5.0.0",
    # Cron expression parsing
    "croniter>=6.0.0",
    "deepagents>=0.7.13",
    "limits>=5.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_server"]


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0",
    "ty>=0.0.17,<0.1.0",
    "bandit>=1.8.0",
    "pre-commit>=4.0.1",
    "langchain-openai>=1.1.14",
    "langchain>=1.3.9",
    "langchain-mcp-adapters>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# src/graphs holds user graph packages (shopping_agent, research_agent, shared);
# tests/e2e/graphs holds the e2e carrier graphs. Listing these roots makes isort
# treat their packages as first-party automatically.
src = ["src", "src/graphs", "tests/e2e/graphs"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # Within an except clause, raise exceptions with `raise ... from err`
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "ARG005", # Unused lambda argument
    "SIM108", # Use ternary operator (less readable in many cases)
]

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.ty.environment]
python-version = "3.12"

# Extra signal from ty's "coming from mypy/pyright" guide; each rule verified
# to fire zero times in this codebase at adoption time.
[tool.ty.rules]
division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert statements
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src/graphs", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
console_output_style = "progress"
addopts = "--strict-markers --tb=short -ra --color=yes -m 'not auth_only and not manual_auth'"
markers = [
    "unit: unit tests (fast, no external dependencies)",
    "integration: integration tests (database or multiple components)",
    "e2e: end-to-end tests requiring a running server",
    "slow: tests that take more than 1 second",
    "prod_only: tests that require Redis workers (skipped in dev mode)",
    "auth_only: tests that require an auth-enabled server (run with -m auth_only or make e2e-auth)",
    "manual_auth: manual auth tests (store org isolation), run explicitly with -m manual_auth",
]
