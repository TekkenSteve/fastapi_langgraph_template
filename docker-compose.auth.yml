# Auth E2E override — JWT mock auth + custom routes, no Redis host ports.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.auth.yml up -d postgres app
#
# Postgres is published on 5433 to avoid clashing with a local Postgres on 5432.
# Redis is profile-gated so it is not started for auth E2E.

services:
  postgres:
    ports: !override
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"

  redis:
    profiles:
      - redis

  app:
    environment:
      - AUTH_TYPE=custom
      - GRAPHS_CONFIG=/app/langgraph.auth.json
      - REDIS_BROKER_ENABLED=false
      - POSTGRES_HOST=postgres
      - PYTHONPATH=/app/src:/app/tests/e2e/graphs
    volumes:
      - ./langgraph.auth.json:/app/langgraph.auth.json:ro
      - ./tests/e2e/graphs:/app/tests/e2e/graphs:ro
    depends_on: !override
      postgres:
        condition: service_healthy
