name: E2E

# E2E tests need a real OPENAI_API_KEY (the example ReAct agents call a live
# LLM). Prefer an environment secret (`environment: e2e` below) over a repo
# secret: a workflow dispatched from any branch can read repo secrets, while an
# environment secret is only handed to the jobs that declare it. Nightly
# scheduling is left out on purpose for a template — enable it if you want it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod, auth]

# Least privilege; e2e only reads the checkout.
permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  e2e:
    name: e2e (${{ inputs.mode }})
    runs-on: ubuntu-latest
    # Scopes OPENAI_API_KEY to this job when it is set as an environment secret.
    environment: e2e
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Prepare .env
        run: cp .env.example .env
      - name: Run e2e suite
        run: make e2e-${{ inputs.mode }}
